<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>15 — Despedida</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <style>
    body { padding: 40px 60px; overflow: hidden; display: flex; flex-direction: column; }

    .main-content {
      flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; text-align: center;
    }

    .gracias-title {
      font-size: 6rem;
      font-weight: 900;
      color: white;
      margin: 0 0 10px 0;
      line-height: 1.1;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: linear-gradient(135deg, #ffffff, #93c5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 15px 40px rgba(59,130,246,0.4));
    }

    .preguntas-subtitle {
      font-size: 2.5rem;
      font-weight: 700;
      color: #34d399; /* Verde esmeralda para contrastar */
      margin: 0;
    }

  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="dot-grid"></div>
  <div class="corner corner-tl"></div><div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div><div class="corner corner-br"></div>

  <div class="slide-label">Agradecimiento y preguntas</div>

  <div class="main-content">
    <h1 class="gracias-title">Muchas Gracias</h1>
    <h2 class="preguntas-subtitle">¿Preguntas?</h2>
  </div>

</body>
</html>
